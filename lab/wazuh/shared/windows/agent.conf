<!--
  Centralized config for agents in the "windows" group.
  The default agent config already collects Security, System and Application;
  these add the channels the detections in this repo rely on.
  Deploy with lab\build\push-wazuh-config.ps1
-->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
