# Atomic Red Team tests the lab runs against win11-ep.
#
# technique  ATT&CK v19 ID (Atomic Red Team moved to v19 in May 2026)
# legacy     pre-v19 ID, which is what Wazuh 4.14's built-in rules are tagged with
# test       test number inside the technique's YAML (Invoke-AtomicTest -TestNumbers)
# guid       auto_generated_guid, so a renumbered test is noticed
# input_args overrides; keep everything inside the lab segment (no internet during runs)
# expect     rule IDs (custom 1001xx-1002xx or built-in) that must all fire live for the test to PASS
# replay     rules that cover the same attack when Defender is absent; Defender stops these atomics
#            before Sysmon sees the process, so they are proven by tests/logtest replay instead

tests:
  - technique: T1059.001
    name: PowerShell Command Execution (encoded command)
    test: 17
    guid: a538de64-1c74-46ed-aa60-b995ed302598
    expect: ["92057"]   # built-in: powershell spawned powershell with base64 command

  - technique: T1059.001
    name: PowerShell Invoke Known Malicious Cmdlets
    test: 18
    guid: 49eb9404-5e0f-4031-a179-b40f7be385e3
    expect: ["100204"]   # Defender blocks it (AMSI) before the script block is logged
    replay: ["100180"]   # proven in tests/logtest for hosts without Defender

  - technique: T1003.001
    name: Dump LSASS.exe Memory using comsvcs.dll
    test: 2
    guid: 2536dee2-12fb-459a-8c37-971844fa73be
    expect: ["100201"]   # Defender blocks the command line; rundll32 never starts
    replay: ["100110", "100111"]

  - technique: T1053.005
    name: Scheduled task Local
    test: 2
    guid: 42f53695-ad4a-4546-abb6-7d837f644a71
    expect: ["100140"]

  - technique: T1547.001
    name: Reg Key Run
    test: 1
    guid: e55be3fd-3521-4610-9d1a-e210e42dcf05
    expect: ["100151"]

  - technique: T1218.011
    name: Rundll32 execute VBscript command
    test: 2
    guid: 638730e7-7aed-43dc-bf8c-8117f805f5bb
    expect: ["100202"]   # Defender blocks it before rundll32 starts
    replay: ["100120"]

  - technique: T1105
    name: certutil download (urlcache)
    test: 7
    guid: dd3b61dd-7bbc-48cd-ab51-49ad1a776df0
    expect: ["100203"]   # Defender blocks it before certutil starts
    replay: ["100130"]
    input_args:
      remote_file: http://10.10.10.10:8000/atomic-payload.txt

  - technique: T1136.001
    name: Create a new user in a command prompt
    test: 4
    guid: 6657864e-0323-4206-9344-ac9cd7265a4f
    expect: ["92040"]   # built-in: net1.exe user creation

  - technique: T1087.001
    name: Enumerate all accounts on Windows (Local)
    test: 8
    guid: 80887bec-5a9b-4efc-a81d-f83eb2eb32ab
    expect: ["100190"]

  - technique: T1685.005
    legacy: T1070.001
    name: Clear Logs (Security)
    test: 1
    guid: e6abb60e-26b8-41da-8aae-0c35174b0967
    expect: ["100160", "100161"]
    input_args:
      log_name: Security

  - technique: T1685
    legacy: T1562.001
    name: Tamper with Windows Defender ATP PowerShell
    test: 19
    guid: 6b8df440-51ec-4d53-bf83-899591c9b5d7
    expect: ["100170"]
